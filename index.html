<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dasturchi Portfoliosi | Loyihalar Galereyasi</title>
    <!-- TailwindCSS CDN orqali ulangan -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React va Babel kutubxonalari -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-900 text-white font-sans">

    <!-- Navigatsiya (Header) -->
    <header class="bg-slate-800/80 backdrop-blur-md sticky top-0 z-50 border-b border-slate-700">
        <div class="max-w-5xl mx-auto px-4 py-4 flex justify-between items-center">
            <a href="#" class="text-xl font-bold text-sky-400">DevPortfolio.uz</a>
            <nav class="space-x-6 text-sm text-slate-300">
                <a href="#about" class="hover:text-sky-400 transition">Men haqimda</a>
                <a href="#skills" class="hover:text-sky-400 transition">Ko'nikmalar</a>
                <a href="#projects" class="hover:text-sky-400 transition">Loyihalar</a>
            </nav>
        </div>
    </header>

    <main>
        <!-- Asosiy tanishtiruv (Profile komponenti shu yerga chiziladi) -->
        <section id="about" class="max-w-5xl mx-auto px-4 py-16 text-center">
            <div id="profile-root"></div>
        </section>

        <!-- Ko'nikmalar (Skills) -->
        <section id="skills" class="bg-slate-800/50 py-14 border-y border-slate-800">
            <div class="max-w-5xl mx-auto px-4">
                <h2 class="text-2xl font-bold mb-8 text-center">Texnologik Ko'nikmalar</h2>
                <div class="grid grid-cols-2 md:grid-cols-4 gap-4 text-center">
                    <div class="bg-slate-800 p-4 rounded-xl border border-slate-700">HTML5 & Semantika</div>
                    <div class="bg-slate-800 p-4 rounded-xl border border-slate-700">CSS3 & TailwindCSS</div>
                    <div class="bg-slate-800 p-4 rounded-xl border border-slate-700">JavaScript (ES6+)</div>
                    <div class="bg-slate-800 p-4 rounded-xl border border-slate-700">Git & GitHub API</div>
                </div>
            </div>
        </section>

        <!-- Loyihalar Galereyasi (RepoList komponenti shu yerga chiziladi) -->
        <section id="projects" class="max-w-5xl mx-auto px-4 py-16">
            <div id="root"></div>
        </section>
    </main>

    <!-- Pastki qism (Footer) -->
    <footer class="text-center py-8 text-slate-500 text-sm border-t border-slate-800">
        © 2026 Veb tizimlari fani | 20-variant Mustaqil ta'lim loyihasi
    </footer>

    <script type="text/babel" src="app.jsx"></script>
</body>
</html>
